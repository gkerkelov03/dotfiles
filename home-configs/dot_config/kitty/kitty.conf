# ~/.config/kitty/kitty.conf
# Translated from foot.ini, kept minimal: no tabs/splits, a multiplexer handles that.

# --- Shell & font -----------------------------------------------------------
shell        fish
font_family  JetBrainsMono Nerd Font
font_size    12

# --- Look -------------------------------------------------------------------
window_padding_width 10
background_opacity   0.40
# Blur (foot's blur=yes) is done by Hyprland itself: decoration { blur { enabled = true } }

# --- Cursor (beam, no blinking, like foot) ----------------------------------
cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0
cursor_trail           0
# Stop kitty's shell integration from changing the cursor shape behind your back
shell_integration      no-cursor

# --- Scrollback -------------------------------------------------------------
scrollback_lines 10000

# --- Behave like a plain terminal -------------------------------------------
confirm_os_window_close 0
enable_audio_bell       no
remember_window_size    no

# --- Keys: start from nothing, so no tab/split/layout shortcuts exist -------
clear_all_shortcuts yes

# Copy / paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scrolling (foot: scrollback-up/down-page)
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down

# Search (foot: search-start). Opens the scrollback in a pager; search with / , n , N
map ctrl+shift+f show_scrollback

# Font size
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
