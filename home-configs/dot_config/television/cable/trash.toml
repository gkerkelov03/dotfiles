[metadata]
name = "trash"
description = "Browse the FreeDesktop trash (trash-cli)"
requirements = ["trash-list", "trash-peek.py"]

[source]
#sort newest files first aka most recently deleted
command = "trash-list 2>/dev/null | sort -r"
display = "{split: :0|split:-:2}/{split: :0|split:-:1}/{split: :0|split:-:0} {split: :1|split:\\::..2} {split: :2..}"
frecency = false

[preview]
command = "trash-peek.py '{}'"

