
[opener]
extract = [
  #Extract archives with yazi when you enter the archive with l and then hover the newly created folder
	{ run = '''set -- %s; before=$(ls -A); ouch d -n "$@"; new=$(ls -A | grep -vxF -e "$before" | head -n 1); [ -n "$new" ] || { f=${1##*/}; new=${f%.*}; new=${new%.tar}; }; [ -e "$new" ] && ya emit reveal "$PWD/$new"''', desc = "Extract here with ouch", for = "unix" },
]

[plugin]
prepend_fetchers = [
  #Git status (yazi-rs/plugins:git)
  { id = "git", url = "*", run = "git", group = "git" },
  { id = "git", url = "*/", run = "git", group = "git" },
]

prepend_preloaders = [
  #3d objects (ruudjhuu/f3d-preview)
  { url = "*.{3mf,obj,pts,ply,stl,step,stp}", run = "f3d-preview" },
]

prepend_previewers = [
  #archives with ndtoan96/ouch
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run  = "ouch --show-file-icons" },

  #md files with glow
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },

  #systemd services
  { url = "*.{service,socket,timer,path,mount,automount,swap,target,slice}", run = '''piper -- { case "$1" in */systemd/user/*) scope=--user ;; *) scope=--system ;; esac; SYSTEMD_COLORS=1 systemctl "$scope" status --no-pager --full --lines=10 -- "$(basename "$1")"; echo; echo "--- Unit file: $1"; echo; cat "$1"; } 2>/dev/null''' },

  #sqlite databases
  { mime = "application/sqlite3", run = 'piper -- sqlite3 "$1" ".schema --indent"' },

  #Audio with ffprobe what comes from ffmpeg
  { mime = "audio/*", run = '''piper -- { echo "Type=$(file -b --mime-type "$1")"; ffprobe -v error -pretty -select_streams a:0 -show_entries format=duration,size:format_tags=artist,album:stream=codec_long_name -of default=noprint_wrappers=1 "$1"; } | sed -E 's/^TAG://; /=N\/A$/d; s/^codec_long_name=/Codec=/; s/^(duration=[0-9:]+)\.[0-9]+/\1/; s/([0-9]+\.[0-9])[0-9]* ([KMG])/\1 \2/; s/^(.)([^=]*)=/\u\1\L\2\E: /' ''' },

  #3d objects (ruudjhuu/f3d-preview)
  { url = "*.{3mf,obj,pts,ply,stl,step,stp}", run = "f3d-preview" },

  #Office documents (gkerkelov03/yazi-office-documents-preview.yazi)
  { mime = "application/{openxmlformats-officedocument.*,oasis.opendocument.*,ms-excel*,ms-powerpoint*,ms-word*,msword}", run = "yazi-office-documents-preview" },
  { url = "*.docx", run = "yazi-office-documents-preview" },
]
