# Where to write the result (pacman reads this file)
--save /etc/pacman.d/mirrorlist

# Only use HTTPS mirrors
--protocol https

# Drop mirrors that haven't synced in the last 12 hours (avoids stale mirrors)
--age 12

# Shortlist: take the 40 most recently synced mirrors
# (this keeps the speed test short instead of testing every mirror in the world)
--latest 40

# Speed test the shortlist by actually downloading from each,
# then keep the 10 fastest, ordered fastest first
--fastest 10
