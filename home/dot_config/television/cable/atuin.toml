[metadata]
name = "atuin"
description = "Search Atuin history with its metadata"
requirements = ["atuin"]

[source]
command = '''atuin history list --print0 --reverse=false --format '{exit}\t{duration}\t{time}\t{directory}\t{host}\t{user}\t{author}\t{intent}\t{session}\t{uuid}\t{relativetime}\t{command}' '''
entry_delimiter = "\u0000"
no_sort = true
display = '{split:\t:11..}'
output = '{split:\t:11..}'

[preview]
command = '''printf '%-14s%s\n' '' '' 'time started:' '{split:\t:2|split: :0|split:-:2}-{split:\t:2|split:-:1}-{split:\t:2|split:-:0} {split:\t:2|split: :1}' 'duration:' '{split:\t:1}' 'when:' '{split:\t:10} ago' 'exit code:' '{split:\t:0}' 'directory:' '{split:\t:3}' 'host:' '{split:\t:4}' 'user:' '{split:\t:5}' 'author:' '{split:\t:6}' 'intent:' '{split:\t:7}' 'session:' '{split:\t:8}' 'uuid:' '{split:\t:9}' '''
